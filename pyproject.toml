[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ted-procurement-dataset"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["requests==2.32.5", "openpyxl==3.1.5"]

[project.scripts]
ted-dataset = "ted_dataset.pipeline:main"

[tool.setuptools.packages.find]
include = ["ted_dataset*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
